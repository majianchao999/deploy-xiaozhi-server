# Docker安装Server

version: '3'
services:
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于简单OTA接口(单服务部署)，以及视觉分析接口
      - "8003:8003"
    volumes:
      # 配置文件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      # 补丁：修复GLM-4.7/5.x等"始终思考"模型报400(错误码1210)，改发 reasoning_effort=low
      - ./data/patches/openai.py:/opt/xiaozhi-esp32-server/core/providers/llm/openai/openai.py
      # 补丁：兼容豆包把function_call返回为数组导致 'list' object has no attribute 'get'
      - ./data/patches/intent_llm.py:/opt/xiaozhi-esp32-server/core/providers/intent/intent_llm/intent_llm.py
      # 补丁：设备MCP布尔回执不再二次调LLM(秒回+避免说错话)，有内容回执包装语义后再给LLM
      - ./data/patches/mcp_executor.py:/opt/xiaozhi-esp32-server/core/providers/tools/device_mcp/mcp_executor.py
      # 补丁：支持多指令function_calls数组(如"往前走3步再后退3步")，此前该格式静默透传
      - ./data/patches/intentHandler.py:/opt/xiaozhi-esp32-server/core/handle/intentHandler.py